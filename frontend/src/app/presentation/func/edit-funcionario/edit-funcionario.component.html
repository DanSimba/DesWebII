<div class="flex flex-col w-full h-full p-8 gap-6 bg-(--queen-pink) border-4 border-(--antique-ruby) rounded-[30px] shadow-[10px_10px_0px_var(--parrot-pink)] overflow-y-auto">

  <!-- Cabeçalho -->
  <div class="flex items-center gap-4 shrink-0">
    <div class="font-bold px-8 py-3 bg-(--queen-pink) border-3 border-(--antique-ruby) text-(--french-puce) text-xl shadow-sm">
      {{ editando ? 'EDITAR' : 'NOVO' }} FUNCIONÁRIO
    </div>
  </div>

  <!-- Card do formulário -->
  <div class="flex-1 min-h-0 flex items-start justify-center">
    <div class="w-full max-w-lg bg-white/50 border-3 border-(--antique-ruby) rounded-2xl p-8 flex flex-col gap-6 shadow-inner">

      <form [formGroup]="form" class="flex flex-col gap-6">

        <!-- Campo nome -->
        <div class="flex flex-col gap-2">
          <label class="text-(--french-puce) font-bold uppercase text-xs tracking-widest">
            Nome do Funcionário
          </label>
          <input
            formControlName="nome"
            type="text"
            placeholder="Nome completo"
            class="w-full p-3 bg-(--queen-pink) font-bold text-sm text-(--french-puce) placeholder-[var(--french-puce)]/40 outline-none border-2 border-(--antique-ruby)/40 rounded-xl focus:border-(--antique-ruby) transition-all"
          />
          @if (form.get('nome')?.invalid && form.get('nome')?.touched) {
            <span class="text-red-700 text-xs font-bold flex items-center gap-1">
              <mat-icon class="text-sm scale-75">error</mat-icon>
              Nome obrigatório (mínimo 3 caracteres)
            </span>
          }
        </div>

        <!-- Campo cargo -->
        <div class="flex flex-col gap-2">
          <label class="text-(--french-puce) font-bold uppercase text-xs tracking-widest">
            Cargo do Funcionário
          </label>
          <input
            formControlName="cargo"
            type="text"
            placeholder="Ex: Técnico de Suporte"
            class="w-full p-3 bg-(--queen-pink) font-bold text-sm text-(--french-puce) placeholder-[var(--french-puce)]/40 outline-none border-2 border-(--antique-ruby)/40 rounded-xl focus:border-(--antique-ruby) transition-all"
          />
          @if (form.get('cargo')?.invalid && form.get('cargo')?.touched) {
            <span class="text-red-700 text-xs font-bold flex items-center gap-1">
              <mat-icon class="text-sm scale-75">error</mat-icon>
              Cargo obrigatório (mínimo 3 caracteres)
            </span>
          }
        </div>

        <!-- Botões -->
        <div class="flex gap-3 pt-2">
          <button
            type="button"
            (click)="onSubmit()"
            class="flex-1 bg-(--french-puce) text-white font-bold px-6 py-3 border-b-4 border-black active:border-b-0 active:translate-y-1 transition-all flex items-center justify-center gap-2 rounded-sm">
            <mat-icon>save</mat-icon> SALVAR
          </button>
          <button
            type="button"
            (click)="cancelar()"
            class="flex-1 bg-white text-(--french-puce) font-bold px-6 py-3 border-3 border-(--antique-ruby) border-b-4 active:border-b-0 active:translate-y-1 transition-all flex items-center justify-center gap-2 rounded-sm hover:bg-(--queen-pink)">
            <mat-icon>close</mat-icon> CANCELAR
          </button>
        </div>

      </form>
    </div>
  </div>

</div>
