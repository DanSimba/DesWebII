<div class="flex flex-col w-full h-full bg-kitty-soft bg-cover bg-center p-6 gap-4 border-4 border-(--antique-ruby) rounded-4xl overflow-hidden text-(--french-puce)">
  
  <div class="bg-(--queen-pink)/90 p-6 border-2 border-(--french-puce) rounded-lg shadow-inner">
    <form [formGroup]="form" class="flex flex-col gap-4">
      
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Descrição do Equipamento</mat-label>
        <input matInput formControlName="descEquip" placeholder="Ex: iPhone 13 Pro">
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Categoria</mat-label>
        <mat-select formControlName="catID">
          @for (cat of cats(); track cat.id) {
            <mat-option [value]="cat.nome">{{ cat.nome }}</mat-option>
          }      
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Descrição do Defeito</mat-label>
        <textarea matInput formControlName="descDefeito" rows="4" placeholder="O que está acontecendo?"></textarea>
      </mat-form-field>

      <div class="flex justify-end mt-2">
        <button (click)="onSubmit(); openPopup('Solicitação criada.', 'ok')"
          class="bg-(--french-puce) text-white border-2 border-(--antique-ruby) px-8 py-3 font-bold text-lg hover:bg-(--antique-ruby) transition-colors shadow-[4px_4px_0px_var(--parrot-pink)] active:translate-y-1">
          SOLICITAR >
        </button>
      </div>
      
    </form>
  </div>
</div>
