<div class="flex flex-col text-lg shrink-0 p-2 bg-pink-200 border-solid border-3 border-(--antique-ruby) rounded-xl shadow-[4px_4px_0px_var(--french-puce)] break-words font-semibold">
    <div class="flex flex-row justify-around">
        <div [style.background-color]="'var(--' + estado() + ')'"
        class="flex w-[13vh] h-[30px] text-sm justify-center items-center rounded-[10px]">
            {{estado()}}
        </div>
        <div class="flex w-[13vw] h-[30px] text-sm justify-center items-center rounded-[10px] bg-(--parrot-pink)">
            {{eqp()}}
        </div>
        @if(nome()){
            <div class="flex w-[15vw] h-[32px] text-base bg-(--parrot-pink) justify-center items-center rounded-[10px]">
                <p>
                    {{nome()}}
                </p>
            </div>
        }
        
    </div>

    <div class="flex m-2 p-4 text-sm bg-(--parrot-pink) p-[4px] rounded-md break-words overflow-y-auto">
        {{desc()}}
    </div>

    <div class="flex flex-row justify-around">
        <div class="flex px-4 text-sm bg-(--parrot-pink) justify-center items-center rounded-md">
            {{data()}}
        </div>
        <div (click)="openSol()" class="flex px-4 text-md bg-(--parrot-pink) justify-center items-center rounded-md hover:cursor-pointer">
            Visualizar
        </div>
    </div>
</div>
